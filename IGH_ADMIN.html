<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IGH-SOFT | لوحة الإدارة</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script>
    const _firebaseConfig = {
        apiKey: "AIzaSyDR1W7vK_cngDpdTeZe8lXmhmNliu5Uj_E",
        authDomain: "igh-pos.firebaseapp.com",
        projectId: "igh-pos",
        storageBucket: "igh-pos.firebasestorage.app",
        messagingSenderId: "838109981839",
        appId: "1:838109981839:web:7057dbe5463b90fa8914fa"
    };
    firebase.initializeApp(_firebaseConfig);
    const _db = firebase.firestore();
    const _auth = firebase.auth();
</script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; min-height: 100vh; }

/* شاشة كلمة المرور */
#loginScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; display: flex; align-items: center; justify-content: center; z-index: 9999; }
.login-card { background: #1e293b; border-radius: 24px; padding: 40px; width: 340px; text-align: center; border: 1px solid #334155; }
.login-logo { font-size: 32px; font-weight: bold; color: #3b82f6; margin-bottom: 8px; }
.login-sub { font-size: 13px; color: #64748b; margin-bottom: 32px; }
.login-input { width: 100%; padding: 12px 16px; border-radius: 20px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 18px; text-align: center; letter-spacing: 4px; margin-bottom: 12px; outline: none; }
.login-input:focus { border-color: #3b82f6; }
.login-btn { width: 100%; padding: 12px; border-radius: 20px; border: none; background: #3b82f6; color: white; font-size: 14px; cursor: pointer; font-weight: 500; }
.login-btn:hover { background: #2563eb; }
.login-error { color: #ef4444; font-size: 12px; margin-top: 8px; min-height: 18px; }

/* لوحة الإدارة */
#adminPanel { display: none; padding: 24px; max-width: 900px; margin: 0 auto; }
.admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #1e293b; }
.admin-logo { font-size: 20px; font-weight: bold; color: #3b82f6; }
.admin-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
.stat-card { background: #1e293b; border-radius: 16px; padding: 16px; text-align: center; border: 1px solid #334155; }
.stat-num { font-size: 28px; font-weight: bold; color: #3b82f6; }
.stat-label { font-size: 12px; color: #64748b; margin-top: 4px; }
.section-title { font-size: 14px; font-weight: 500; color: #94a3b8; margin-bottom: 12px; }

/* إنشاء رمز جديد */
.new-shop-card { background: #1e293b; border-radius: 20px; padding: 20px; margin-bottom: 24px; border: 1px solid #334155; }
.new-shop-form { display: flex; gap: 10px; flex-wrap: wrap; }
.new-shop-form input { flex: 1; min-width: 180px; padding: 10px 16px; border-radius: 20px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 13px; outline: none; }
.new-shop-form input:focus { border-color: #3b82f6; }
.btn-primary { padding: 10px 20px; border-radius: 20px; border: none; background: #3b82f6; color: white; font-size: 13px; cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn-primary:hover { background: #2563eb; }
.btn-danger { padding: 6px 12px; border-radius: 20px; border: none; background: #b91c1c; color: white; font-size: 11px; cursor: pointer; }
.btn-warning { padding: 6px 12px; border-radius: 20px; border: none; background: #d97706; color: white; font-size: 11px; cursor: pointer; }
.btn-success { padding: 6px 12px; border-radius: 20px; border: none; background: #15803d; color: white; font-size: 11px; cursor: pointer; }

/* جدول المحلات */
.shops-table { background: #1e293b; border-radius: 20px; overflow: hidden; border: 1px solid #334155; }
.shop-row { display: grid; grid-template-columns: 2fr 2fr 1fr 1fr auto; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #0f172a; align-items: center; font-size: 13px; }
.shop-row:last-child { border-bottom: none; }
.shop-row.header { background: #0f172a; font-size: 11px; color: #64748b; font-weight: 500; padding: 10px 16px; }
.shop-code { font-family: monospace; font-size: 13px; color: #60a5fa; letter-spacing: 1px; cursor: pointer; }
.shop-code:hover { color: #93c5fd; }
.shop-name { color: #e2e8f0; }
.badge-active { background: #14532d; color: #4ade80; padding: 2px 10px; border-radius: 20px; font-size: 11px; }
.badge-inactive { background: #450a0a; color: #f87171; padding: 2px 10px; border-radius: 20px; font-size: 11px; }
.badge-never { background: #1e293b; color: #64748b; padding: 2px 10px; border-radius: 20px; font-size: 11px; border: 1px solid #334155; }
.shop-actions { display: flex; gap: 6px; }
.copy-toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #16a34a; color: white; padding: 10px 24px; border-radius: 20px; font-size: 13px; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
.copy-toast.show { opacity: 1; }
.logout-btn { background: #334155; border: none; color: #94a3b8; padding: 8px 16px; border-radius: 20px; font-size: 12px; cursor: pointer; }
.duration-select { padding: 6px 12px; border-radius: 20px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 12px; outline: none; }
</style>
</head>
<body>

<!-- شاشة كلمة المرور -->
<div id="loginScreen">
    <div class="login-card">
        <div class="login-logo">IGH-SOFT</div>
        <div class="login-sub">لوحة إدارة المحلات</div>
        <input type="email" id="adminEmail" class="login-input" placeholder="البريد الإلكتروني" autocomplete="off" style="letter-spacing:0;">
        <input type="password" id="adminPassword" class="login-input" placeholder="••••••••" maxlength="30" autocomplete="off">
        <button class="login-btn" onclick="checkPassword()">دخول ←</button>
        <div class="login-error" id="loginError"></div>
    </div>
</div>

<!-- لوحة الإدارة -->
<div id="adminPanel">
    <div class="admin-header">
        <div class="admin-logo">IGH-SOFT — لوحة الإدارة</div>
        <button class="logout-btn" onclick="logout()">خروج</button>
    </div>

    <!-- إحصاءات -->
    <div class="admin-stats">
        <div class="stat-card">
            <div class="stat-num" id="totalShops">0</div>
            <div class="stat-label">إجمالي المحلات</div>
        </div>
        <div class="stat-card">
            <div class="stat-num" id="activeShops">0</div>
            <div class="stat-label">محلات نشطة</div>
        </div>
        <div class="stat-card">
            <div class="stat-num" id="expiredShops">0</div>
            <div class="stat-label">منتهية الصلاحية</div>
        </div>
    </div>

    <!-- إنشاء رمز جديد -->
    <div class="new-shop-card">
        <div class="section-title">إنشاء محل جديد</div>
        <div class="new-shop-form">
            <input type="text" id="newShopName" placeholder="اسم التاجر أو المحل">
            <select class="duration-select" id="newShopDuration">
                <option value="30">شهر واحد</option>
                <option value="90">3 أشهر</option>
                <option value="180">6 أشهر</option>
                <option value="365">سنة كاملة</option>
                <option value="0">بدون انتهاء</option>
            </select>
            <button class="btn-primary" onclick="createShop()">+ إنشاء رمز</button>
        </div>
    </div>

    <!-- جدول المحلات -->
    <div class="section-title">المحلات المسجلة</div>
    <div class="shops-table">
        <div class="shop-row header">
            <span>اسم المحل</span>
            <span>الرمز</span>
            <span>الصلاحية</span>
            <span>آخر دخول</span>
            <span>إجراءات</span>
        </div>
        <div id="shopsList"></div>
    </div>
</div>

<div class="copy-toast" id="copyToast">✅ تم نسخ الرمز</div>

<script>
    _auth.onAuthStateChanged((user) => {
        if (user) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            loadShops();
        } else {
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('adminPanel').style.display = 'none';
        }
    });

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('adminEmail').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('adminPassword').focus(); });
        document.getElementById('adminPassword').addEventListener('keydown', e => { if (e.key === 'Enter') checkPassword(); });
    });

    let _adminEmail = '', _adminPwd = '';

    async function checkPassword() {
        const email = document.getElementById('adminEmail').value.trim();
        const pwd = document.getElementById('adminPassword').value;
        const errEl = document.getElementById('loginError');
        if (!email || !pwd) { errEl.textContent = '⚠️ أدخل البريد الإلكتروني وكلمة المرور'; return; }
        errEl.textContent = '⏳ جاري الدخول...';
        try {
            await _auth.signInWithEmailAndPassword(email, pwd);
            // ✅ إصلاح #2: نحتفظ بالبريد فقط لإعادة الدخول بعد إنشاء محل
            // كلمة المرور تبقى في الذاكرة فقط طوال الجلسة ثم تُمسح عند الخروج
            _adminEmail = email;
            _adminPwd = pwd;
            document.getElementById('adminPassword').value = ''; // مسح الحقل فوراً
        } catch(err) {
            errEl.textContent = '❌ البريد أو كلمة المرور غير صحيحة';
            document.getElementById('adminPassword').value = '';
        }
    }

    function logout() {
        // ✅ إصلاح #2: مسح البيانات الحساسة من الذاكرة عند الخروج
        _adminEmail = '';
        _adminPwd = '';
        _auth.signOut();
    }

    function generateCode() {
        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        let code = 'IGH-';
        for (let i = 0; i < 8; i++) code += chars[Math.floor(Math.random() * chars.length)];
        return code;
    }

    async function createShop() {
        const name = document.getElementById('newShopName').value.trim();
        const days = parseInt(document.getElementById('newShopDuration').value);
        if (!name) { alert('أدخل اسم المحل'); return; }

        const code = generateCode();
        const now = new Date();
        const expiresAt = days > 0 ? new Date(now.getTime() + days * 24 * 60 * 60 * 1000).toISOString() : null;

        // ✅ إصلاح #1: كلمة المرور مشتقة من الرمز — لا تُحفظ في Firestore أبداً
        // البرنامج الرئيسي يشتق نفس كلمة المرور بنفس الصيغة عند الحاجة
        const shopEmail = `shop_${code.toLowerCase()}@igh-pos.app`;
        const shopPassword = 'IGH_' + code + '_pos2026';

        try {
            await _auth.createUserWithEmailAndPassword(shopEmail, shopPassword);
            // العودة لحساب المشرف
            await _auth.signInWithEmailAndPassword(_adminEmail, _adminPwd);
        } catch(authErr) {
            if (authErr.code !== 'auth/email-already-in-use') {
                console.warn('[IGH-ADMIN] Auth create warning:', authErr.code);
            }
            // تأكد من العودة للمشرف حتى لو فشل الإنشاء
            try { await _auth.signInWithEmailAndPassword(_adminEmail, _adminPwd); } catch(e) {}
        }

        await _db.collection('licenses').doc(code).set({
            name,
            code,
            createdAt: now.toISOString(),
            expiresAt,
            active: true,
            lastSeen: null,
            email: shopEmail
            // ✅ لا يوجد حقل password هنا — مشتق دائماً من الرمز
        });

        document.getElementById('newShopName').value = '';
        loadShops();
        copyCode(code);
        alert(`✅ تم إنشاء رمز للمحل "${name}"\n\nالرمز: ${code}\n\nتم نسخه تلقائياً — أرسله للتاجر.`);
    }

    async function loadShops() {
        // التحقق من تسجيل الدخول أولاً
        const user = _auth.currentUser;
        if (!user) { alert('يجب تسجيل الدخول أولاً'); return; }

        try {
            const snapshot = await _db.collection('licenses').orderBy('createdAt', 'desc').get();
            const shops = [];
            snapshot.forEach(doc => shops.push({ id: doc.id, ...doc.data() }));

            const now = new Date();
            let active = 0, expired = 0;
            let html = '';

            shops.forEach(s => {
                const isExpired = s.expiresAt && new Date(s.expiresAt) < now;
                const isActive = s.active && !isExpired;
                if (isActive) active++; else expired++;

                const expiry = s.expiresAt
                    ? (isExpired ? '❌ منتهية' : '✅ ' + daysLeft(s.expiresAt) + ' يوم')
                    : '♾️ دائم';

                const lastSeen = s.lastSeen
                    ? timeSince(s.lastSeen)
                    : '<span class="badge-never">لم يُستخدم</span>';

                const statusBadge = isActive
                    ? '<span class="badge-active">نشط</span>'
                    : '<span class="badge-inactive">موقوف</span>';

                html += `<div class="shop-row">
                    <span class="shop-name">${s.name} ${statusBadge}</span>
                    <span class="shop-code" onclick="copyCode('${s.code}')" title="اضغط للنسخ">${s.code}</span>
                    <span>${expiry}</span>
                    <span>${lastSeen}</span>
                    <div class="shop-actions">
                        ${isActive
                            ? `<button class="btn-danger" onclick="toggleShop('${s.code}', false)">إيقاف</button>`
                            : `<button class="btn-success" onclick="toggleShop('${s.code}', true)">تفعيل</button>`
                        }
                        <button class="btn-warning" onclick="renewShop('${s.code}')">تجديد</button>
                        <button style="padding:6px 12px;border-radius:20px;border:none;background:#450a0a;color:#f87171;font-size:11px;cursor:pointer;" onclick="deleteShop('${s.code}', '${s.name}')">🗑️</button>
                    </div>
                </div>`;
            });

            document.getElementById('shopsList').innerHTML = html || '<div style="padding:20px;text-align:center;color:#64748b;">لا توجد محلات بعد</div>';
            document.getElementById('totalShops').textContent = shops.length;
            document.getElementById('activeShops').textContent = active;
            document.getElementById('expiredShops').textContent = expired;

        } catch(err) {
            console.error(err);
            document.getElementById('shopsList').innerHTML = '<div style="padding:20px;text-align:center;color:#f87171;">❌ خطأ في تحميل البيانات — ' + err.message + '</div>';
        }
    }

    async function toggleShop(code, status) {
        await _db.collection('licenses').doc(code).update({ active: status });
        loadShops();
    }

    async function renewShop(code) {
        const days = parseInt(prompt('كم يوماً تريد التجديد؟', '30'));
        if (!days || isNaN(days)) return;
        const newExpiry = new Date(Date.now() + days * 24 * 60 * 60 * 1000).toISOString();
        await _db.collection('licenses').doc(code).update({ expiresAt: newExpiry, active: true });
        loadShops();
        alert(`✅ تم تجديد الرمز لـ ${days} يوماً`);
    }

    async function deleteShop(code, name) {
        if (!confirm(`⚠️ تحذير نهائي\n\nهل أنت متأكد من حذف محل "${name}" نهائياً؟\n\nسيتم حذف:\n• رخصة المحل\n• كل بيانات المحل (منتجات، زبائن، مبيعات)\n\nهذا الإجراء لا يمكن التراجع عنه.`)) return;
        if (!confirm(`تأكيد أخير — هل تريد فعلاً حذف "${name}"؟`)) return;

        try {
            // ✅ إصلاح #3: حذف devices subcollection أولاً لتنظيف كامل
            const devSnap = await _db.collection('shops').doc(code).collection('devices').get();
            const devDeletes = devSnap.docs.map(d => d.ref.delete());
            await Promise.all(devDeletes);

            // حذف بيانات المحل والرخصة
            await _db.collection('shops').doc(code).delete();
            await _db.collection('licenses').doc(code).delete();
            loadShops();
            alert(`✅ تم حذف محل "${name}" بالكامل`);
        } catch(err) {
            alert('❌ خطأ في الحذف: ' + err.message);
            console.error(err);
        }
    }

    function copyCode(code) {
        navigator.clipboard.writeText(code).catch(() => {});
        const toast = document.getElementById('copyToast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function daysLeft(isoDate) {
        const diff = new Date(isoDate) - new Date();
        return Math.max(0, Math.ceil(diff / (1000 * 60 * 60 * 24)));
    }

    function timeSince(isoDate) {
        const diff = Date.now() - new Date(isoDate).getTime();
        const mins = Math.floor(diff / 60000);
        const hours = Math.floor(mins / 60);
        const days = Math.floor(hours / 24);
        if (days > 0) return `منذ ${days} يوم`;
        if (hours > 0) return `منذ ${hours} ساعة`;
        if (mins > 0) return `منذ ${mins} دقيقة`;
        return 'الآن';
    }
</script>
</body>
</html>
